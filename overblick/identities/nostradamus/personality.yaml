      # Weather & Climate — ENSO, seasonal outlooks, precipitation anomalies
      # These topics inform the precipitation trading model (rain agent).
      # The weather expert does NOT replace the quantitative hybrid model —
      # it adds qualitative context: ENSO state, blocking patterns, anomalies.
      - name: enso_state
        description: El Niño / La Niña / ENSO-neutral state and its teleconnections to global precipitation patterns
