    # 6 Domain Experts with PID tuning
    domain_experts:
      # ── Geopolitics ──────────────────────────────────────────────
      # Active conflicts, military tensions, nuclear threats
      - name: geopolitics
        topics: [russia_ukraine, us_iran, iran_regime, iran_nuclear_deal, china_taiwan, israel_mideast, putin, xi, north_korea, nuclear_proliferation]
        clamp_pp: 10
        p_weight: 0.2
        cadence_hours: 4

      # ── Politics ─────────────────────────────────────────────────
      # Elections, alliances, demographic shifts, leadership
      - name: politics
        topics: [us_elections, eu_nato, india, migration]
        clamp_pp: 12
        p_weight: 0.3
        cadence_hours: 4

      # ── Economics ────────────────────────────────────────────────
      # Monetary policy, markets, inflation, recession
      - name: economics
        topics: [fed_policy, oil_price, bitcoin, us_inflation, us_recession, stock_market, opec]
        clamp_pp: 15
        p_weight: 0.5
        cadence_hours: 2

      # ── Trade & Currency ─────────────────────────────────────────
      # Global trade flows, currency strength, geopolitical blocs
      - name: trade_currency
        topics: [us_china_trade, global_trade, usd_strength, brics_g7]
        clamp_pp: 12
        p_weight: 0.4
        cadence_hours: 4

      # ── Technology ───────────────────────────────────────────────
      # AI race, energy transition
      - name: technology
        topics: [ai_race, energy_transition]
        clamp_pp: 12
        p_weight: 0.3
        cadence_hours: 8

      # ── Science ──────────────────────────────────────────────────
      # Health, UFO disclosure, scientific breakthroughs
      - name: science
        topics: [us_measles, alien_disclosure]
        clamp_pp: 5
        p_weight: 0.8
        cadence_hours: 24

      # ── Weather & Climate ─────────────────────────────────────────
      # ENSO state, polar vortex, and per-city precipitation outlooks.
      # Lower clamp (±8pp) because weather science is more constrained
      # than geopolitics. High p_weight (0.7) because precipitation
      # markets are under-researched — market prices are often stale.
      # Cadence 6h: ENSO/PV state changes slowly, daily digest is enough.
      - name: weather
        topics: [enso_state, polar_vortex, precipitation_nyc, precipitation_seattle, precipitation_london, precipitation_hongkong, precipitation_seoul]
        clamp_pp: 8
        p_weight: 0.7
        cadence_hours: 6
        system_prompt: >
          You are a senior operational meteorologist specializing in seasonal
          and sub-seasonal precipitation forecasting. You understand ENSO
          teleconnections, polar vortex dynamics, atmospheric rivers, monsoon
          systems, and how large-scale climate drivers shift monthly precipitation
          probabilities. You read ECMWF seasonal outlooks, NOAA CPC forecasts,
          and KMA/Met Office/HKO seasonal bulletins. You are NOT a climate change
          communicator — you are a probabilistic forecaster. Your estimates are
          calibrated: if you say 70%, you mean it rains more than average 7 times
          out of 10. Historical base rates anchor you; anomalies require strong
          evidence. Status quo (near-normal precipitation) is always the prior.

