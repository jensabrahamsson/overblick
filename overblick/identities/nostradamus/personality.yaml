################################################################################
# NOSTRADAMUS — ORACLE / THINK TANK
# ─────────────────────────────────────────────────────────────────────────────
# Agent Identity: Nostradamus
# Role: Market intelligence — produces probabilities, NOT trades
# Named after: The famous 16th-century seer
# Platform: Överblick Framework
# Owner: @jensabrahamsson
################################################################################

identity:
  name: "nostradamus"
  display_name: "Nostradamus"
  version: "1.0"
  role: "Oracle — Market Intelligence Engine"
  description: "Produces probability assessments for 34 world topics (incl. 7 weather/climate) via 43-edge causal graph and 6 domain experts. Writes to data/shared/ for PolyTrader and Pohlman to consume. Does NOT trade."

  owner: "@jensabrahamsson"
  owner_platform: "X (Twitter)"
  origin_project: "Överblick"
  is_bot: true

################################################################################
# OPERATIONAL CONFIG
################################################################################
operational:
  # LLM routing — high priority routes to remote backends only (Gemma/Mistral).
  # Never uses local (qwen3.5:9b) — too slow, causes 120s timeouts.
  # priority=high → remote2 (Mistral) first, fallback to remote (Gemma)
  # complexity=high → remote (Gemma) first, fallback to remote2 (Mistral)
  llm:
    timeout_seconds: 120
    default_priority: high  # Prefer remote backends, skip local

  # Plugins — oracle inherits all monitoring (RSS, YouTube, topic tracker).
  # Do NOT add polymarket_monitor separately — it would create a duplicate instance.
  plugins:
    - "oracle"                # Think tank: 27 topics, 58 edges, 5 MoE experts + full monitoring
    - "ai_digest"             # Market news and analysis

  # Schedule
  schedule:
    active_hours: "00:00-23:59"
    timezone: "UTC"

  # Oracle config (same as current thinktank)
  polymarket_monitor:
    check_interval_minutes: 1
    max_markets: 50
    min_probability_edge: 0.03
    real_api: true
    neo4j:
      uri: "bolt://localhost:7687"
      user: "neo4j"
      password: "password"

    # YouTube remote fetching via Claude1 HTTP transcript server
    # Server rate-limits internally (30s between yt-dlp calls)
    # If server is down, ingesters fall back to local youtube-transcript-api
    youtube_remote_fetch:
      enabled: true
      host: "10.8.0.26"
      port: 9090
      max_channels_per_run: 3          # Server handles rate limiting
      max_videos_per_channel: 2        # 2 latest videos per channel
      min_delay_seconds: 45            # Client-side delay between requests
      max_delay_seconds: 120           # Server adds 30s internally

  # Output: shared data directory for other agents to consume
  oracle:
    output_path: "data/shared/"
    topics:
      # Geopolitics — real Polymarket slugs
      - name: russia_ukraine
        description: Russia-Ukraine conflict developments
        keywords: ["russia", "ukraine", "putin", "zelensky", "donbas", "kharkiv"]
        assessment_deadline: "2026-12-31"
        market_slugs:
          - "russia-x-ukraine-ceasefire-before-2027"
        market_question: "Russia x Ukraine ceasefire by end of 2026?"
      - name: us_iran
        description: US-Iran short-term military actions (April 2026 deadlines)
        keywords: ["iran", "us", "iran", "nuclear", "middle east"]
        assessment_deadline: "2026-04-30"
        market_slugs:
          - "us-forces-enter-iran-by-april-30-899"
          - "will-the-iranian-regime-fall-by-april-30"
          - "us-x-iran-ceasefire-by-april-15-182-528-637"
        market_question: "US forces enter Iran by April 30?"
      - name: iran_regime
        description: Iranian regime stability and fall — longer horizon (end of 2026)
        keywords: ["iran", "regime", "revolution", "protest", "khamenei", "irgc", "tehran"]
        assessment_deadline: "2026-12-31"
        market_slugs:
          - "will-the-iranian-regime-fall-by-the-end-of-2026"
        market_question: "Will the Iranian regime fall before 2027?"
      - name: iran_nuclear_deal
        description: US-Iran nuclear diplomacy and deal prospects
        keywords: ["iran", "nuclear", "deal", "jcpoa", "enrichment", "iaea", "diplomacy"]
        assessment_deadline: "2026-12-31"
        market_slugs:
          - "us-iran-nuclear-deal-before-2027"
        market_question: "US-Iran nuclear deal before 2027?"
      - name: china_taiwan
        description: China-Taiwan military and diplomatic tensions
        keywords: ["china", "taiwan", "xi", "invasion", "strait"]
        market_slugs:
          - "will-china-invade-taiwan-before-2027"
        market_question: "Will China invade Taiwan by end of 2026?"
      - name: israel_mideast
        description: Israel and Middle East conflicts
        keywords: ["israel", "gaza", "hamas", "lebanon", "hezbollah", "netanyahu"]
        market_slugs:
          - "netanyahu-out-by-april-30"
        market_question: "Netanyahu out by April 30?"
      - name: putin
        description: Putin regime stability and actions
        keywords: ["putin", "russia", "kremlin", "regime"]
