        weight: 0.3
        direction: positive
      - from: india
        to: us_china_trade
        weight: 0.4
        direction: negative
      - from: india
        to: global_trade
        weight: 0.3
        direction: positive

      # ── Geopolitics → Politics ───────────────────────────────────
      - from: russia_ukraine
        to: eu_nato
        weight: 0.5
        direction: positive
      - from: china_taiwan
        to: us_elections
        weight: 0.3
        direction: positive

      # ── Weather internal causal graph ─────────────────────────────
      # ENSO drives precipitation anomalies in all cities (teleconnections)
      - from: enso_state
        to: precipitation_nyc
        weight: 0.5
        direction: positive   # El Niño → wetter winters/springs in NE US
      - from: enso_state
        to: precipitation_seattle
        weight: 0.6
        direction: negative   # El Niño → drier winters in Pacific Northwest
      - from: enso_state
        to: precipitation_london
        weight: 0.3
        direction: positive   # weak ENSO signal for UK
      - from: enso_state
        to: precipitation_hongkong
        weight: 0.7
        direction: negative   # El Niño → reduced monsoon/typhoon activity
      - from: enso_state
        to: precipitation_seoul
        weight: 0.6
        direction: negative   # El Niño → drier summers in Korea

      # Polar vortex disruptions drive cold-season precipitation in mid-latitudes
      - from: polar_vortex
        to: precipitation_nyc
        weight: 0.6
        direction: positive   # SSW → blocked pattern → Nor'easters possible
      - from: polar_vortex
        to: precipitation_seoul
        weight: 0.5
        direction: positive   # SSW → cold/wet intrusions in Korea winters
      - from: polar_vortex
        to: precipitation_london
        weight: 0.4
        direction: positive   # SSW → blocked Atlantic flow → wetter UK

