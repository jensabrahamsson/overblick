dashboard:
  network_access: true
  password_hash: ""
framework:
  name: Överblick
  version: 0.1.0
llm:
  backend_preference:
  - remote
  - remote2
  - deepseek
  - local
  # remote=10.8.0.24 (primary), remote2=10.8.0.22 (fallback), deepseek (cloud), local (last)
  backends:
    deepseek:
      api_url: https://api.deepseek.com/v1
      enabled: true
      model: deepseek-chat
      type: deepseek
    local:
      enabled: true
      host: 127.0.0.1
      model: qwen3.5:9b
      port: 11434
      type: ollama
      max_concurrent: 1
    remote:
      enabled: true
      host: 10.8.0.24
      model: dolphin-mistral-24b-venice-edition-i1
      port: 1234
      type: ollama
      max_concurrent: 6
    remote2:
      enabled: true
      host: 10.8.0.22
      model: dolphin-mistral-24b-venice-edition-i1
      port: 1234
      type: ollama
      max_concurrent: 6
  default_backend: remote
  gateway_url: http://127.0.0.1:8200
  max_tokens: 8000
  temperature: 0.7
local_plugins:
  stal: []
principal:
  language: en
  timezone: Europe/Stockholm
