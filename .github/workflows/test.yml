name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python3.13 -m venv /tmp/venv-${{ github.run_id }}
          . /tmp/venv-${{ github.run_id }}/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[gateway,dashboard,dev]"

      - name: Lint with ruff and black
        continue-on-error: true
        run: |
          . /tmp/venv-${{ github.run_id }}/bin/activate
          ruff check overblick/ tests/
          black --check --diff overblick/ tests/
          mypy --ignore-missing-imports --disable-error-code misc overblick/

      - name: Run tests
        run: |
          . /tmp/venv-${{ github.run_id }}/bin/activate
          pytest tests/ -v -m "not llm and not e2e and not llm_slow" --ignore=tests/test_dashboard_playwright.py --ignore=tests/chaos --tb=short

      - name: Cleanup venv
        if: always()
        run: rm -rf /tmp/venv-${{ github.run_id }}
